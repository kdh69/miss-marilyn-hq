name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/backend/preflight/requirements.txt }
      - run: npm ci
      - run: pip install -r apps/backend/preflight/requirements.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Schema + status-rule tests
        run: npm test
      - name: KDP preflight tests
        run: npm run test:preflight
      - name: Build Clara's panel
        run: npm run build -w @mm/web
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
