name: MM backend tick

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (off the hour; GitHub delays :00 runs)
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [tick, doctor, dryrun, qc, task, sim, lesson, setup]
        default: tick
      task_id:
        description: "qc / task: the task ID, e.g. T-0038 · lesson: who it applies to (a role, a task type or all)"
        type: string
        default: ""
      value:
        description: "qc: pass or fail · task: the new status · sim: blank, --keep or --clean"
        type: string
        default: ""
      text:
        description: "qc: summary for Clara (pass) or what to fix (fail) · task: why · lesson: the rule. Shows in the public log."
        type: string
        default: ""

concurrency:
  group: mm-backend
  cancel-in-progress: false   # never run two ticks against the Sheet at once

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a tick takes ~30 s; the sim paces itself to Sheets' 60 calls/min
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      MM_CORE_SHEET_ID: ${{ secrets.MM_CORE_SHEET_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KYLE_EMAIL: ${{ secrets.KYLE_EMAIL }}
      CLARA_EMAIL: ${{ secrets.CLARA_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
      PANEL_URL: ${{ secrets.PANEL_URL }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      GOOGLE_OWNER_REFRESH_TOKEN: ${{ secrets.GOOGLE_OWNER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip until secrets are set
        id: gate
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$MM_CORE_SHEET_ID" ]; then
            echo "Secrets not set yet; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci --workspace @mm/backend --include-workspace-root
      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r apps/backend/preflight/requirements.txt
      - if: steps.gate.outputs.skip != 'true'
        env:   # inputs go through env, never pasted into the script
          JOB: ${{ github.event.inputs.job || 'tick' }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          VALUE: ${{ github.event.inputs.value }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          case "$JOB" in
            tick) npm run backend ;;
            doctor|dryrun) npm run "$JOB" ;;
            qc|task) npm run "$JOB" -- "$TASK_ID" "$VALUE" "$TEXT" ;;
            sim) npm run sim -- "$VALUE" ;;
            lesson) npm run lesson -- "$TASK_ID" "$TEXT" ;;
            setup) npm run sheet:setup ;;   # after a schema.json change
            *) echo "unknown job: $JOB"; exit 1 ;;
          esac
